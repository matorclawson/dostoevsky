<title id="t">Synchronous publish throughput</title><desc id="d">Grouped bars of median messages per second at 1, 8 and 32 producers for Dostoevsky and embedded JetStream, with each trial as a dot. Dostoevsky wins at 1, 8 and 32 producers.</desc>
