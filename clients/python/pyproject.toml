[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dostoevsky-client"
version = "0.1.0"
description = "Binary HTTP client for Dostoevsky durable streams (standard library only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dostoevsky", "streaming", "durable", "queue", "messaging"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/rodriveracom/dostoevsky"
Documentation = "https://github.com/rodriveracom/dostoevsky/blob/main/docs/clients.md"
Source = "https://github.com/rodriveracom/dostoevsky/tree/main/clients/python"

[tool.setuptools]
packages = ["dostoevsky_client"]
