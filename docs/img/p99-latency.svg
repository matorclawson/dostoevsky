<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" role="img" aria-labelledby="t d">
<title id="t">p99 publish latency</title><desc id="d">Grouped bars of median p99 publish-to-acknowledgement latency in milliseconds at 1, 8 and 32 producers for Dostoevsky and embedded JetStream, with each trial as a dot. Dostoevsky wins at 1, 8 and 32 producers.</desc>
