<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 346" width="800" height="346" role="img" aria-labelledby="t d">
<title id="t">The Dostoevsky quick start in a terminal</title>
<desc id="d">A job is published and read, the gateway is killed and restarted, and publishing the same ID again returns the same offset. Output: python-demo b'task from python' Receipt(partition=0, offset=1) Receipt(partition=0, offset=1) b'paid'</desc>
<rect width="100%" height="100%" rx="8" fill="#0d1117" stroke="#3d444d"/>
<circle cx="20" cy="20" r="6" fill="#ff5f57"/><circle cx="40" cy="20" r="6" fill="#febc2e"/><circle cx="60" cy="20" r="6" fill="#28c840"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<text x="16" y="52" fill="#e6edf3" xml:space="preserve" textLength="568.0" lengthAdjust="spacingAndGlyphs">$ export DOSTOEVSKY_TOKEN=$(go run ./cmd/dostoevsky-gateway -gen-token)</text>
<text x="16" y="72" fill="#e6edf3" xml:space="preserve" textLength="272.0" lengthAdjust="spacingAndGlyphs">$ export PYTHONPATH=clients/python</text>
<text x="16" y="92" fill="#e6edf3" xml:space="preserve" textLength="736.0" lengthAdjust="spacingAndGlyphs">$ PY='import os; from dostoevsky_client import Client; c = Client("http://127.0.0.1:8787", o</text>
<text x="16" y="112" fill="#e6edf3" xml:space="preserve" textLength="280.0" lengthAdjust="spacingAndGlyphs">    s.environ["DOSTOEVSKY_TOKEN"])'</text>
<text x="16" y="132" fill="#9198a1" xml:space="preserve" textLength="664.0" lengthAdjust="spacingAndGlyphs"># `make dev-gateway &amp;` is running in the background (started by the capture script)</text>
<text x="16" y="152" fill="#e6edf3" xml:space="preserve" textLength="192.0" lengthAdjust="spacingAndGlyphs">$ make dev-client-python</text>
<text x="16" y="172" fill="#7ee787" xml:space="preserve" textLength="248.0" lengthAdjust="spacingAndGlyphs">python-demo b'task from python'</text>
<text x="16" y="192" fill="#e6edf3" xml:space="preserve" textLength="536.0" lengthAdjust="spacingAndGlyphs">$ python3 -c "$PY; print(c.publish('jobs', b'paid', id='order-1'))"</text>
<text x="16" y="212" fill="#7ee787" xml:space="preserve" textLength="240.0" lengthAdjust="spacingAndGlyphs">Receipt(partition=0, offset=1)</text>
<text x="16" y="232" fill="#9198a1" xml:space="preserve" textLength="472.0" lengthAdjust="spacingAndGlyphs"># the gateway is force-killed (SIGKILL), then started again</text>
<text x="16" y="252" fill="#e6edf3" xml:space="preserve" textLength="536.0" lengthAdjust="spacingAndGlyphs">$ python3 -c "$PY; print(c.publish('jobs', b'paid', id='order-1'))"</text>
<text x="16" y="272" fill="#7ee787" xml:space="preserve" textLength="240.0" lengthAdjust="spacingAndGlyphs">Receipt(partition=0, offset=1)</text>
<text x="16" y="292" fill="#e6edf3" xml:space="preserve" textLength="424.0" lengthAdjust="spacingAndGlyphs">$ python3 -c "$PY; print(c.read('jobs', 0, 1).value)"</text>
<text x="16" y="312" fill="#7ee787" xml:space="preserve" textLength="56.0" lengthAdjust="spacingAndGlyphs">b'paid'</text>
</g></svg>
